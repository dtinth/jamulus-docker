name: Docker

on:
  schedule:
    - cron: '41 16 * * *'
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dtinth/jamulus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Jamulus version
        run: echo "JAMULUS_VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          username: dtinth
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=v${{ env.JAMULUS_VERSION }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JAMULUS_VERSION=${{ env.JAMULUS_VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Mint tagger token
        if: github.ref == 'refs/heads/main'
        id: tagger-token
        uses: octo-sts/action@main
        with:
          scope: dtinth/jamulus-docker
          identity: tagger

      - name: Create version tag
        if: github.ref == 'refs/heads/main'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "v${{ env.JAMULUS_VERSION }}" != "$LATEST_TAG" ]; then
            git remote set-url origin https://x-access-token:${{ steps.tagger-token.outputs.token }}@github.com/dtinth/jamulus-docker.git
            git tag -a "v${{ env.JAMULUS_VERSION }}" -m "v${{ env.JAMULUS_VERSION }}"
            git push origin "v${{ env.JAMULUS_VERSION }}"
          fi

      - name: Update IMAGE_INFO.md
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"

          docker pull --platform linux/amd64 --quiet "$IMAGE_REF"
          AMD64_ID=$(docker image inspect "$IMAGE_REF" --format='{{.ID}}')
          DISTRO=$(docker run --rm "$AMD64_ID" sh -c 'grep PRETTY_NAME /etc/os-release | cut -d\" -f2')
          SIZE_AMD64=$(docker image inspect "$AMD64_ID" --format='{{.Size}}' | numfmt --to=iec --suffix=B)

          docker pull --platform linux/arm64 --quiet "$IMAGE_REF"
          ARM64_ID=$(docker image inspect "$IMAGE_REF" --format='{{.ID}}')
          SIZE_ARM64=$(docker image inspect "$ARM64_ID" --format='{{.Size}}' | numfmt --to=iec --suffix=B)

          docker pull --platform linux/amd64 --quiet debian:oldstable-slim
          BASE_DIGEST=$(docker image inspect debian:oldstable-slim --format='{{index .RepoDigests 0}}')

          {
            echo "# Image Info"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Updated | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| Jamulus version | ${{ env.JAMULUS_VERSION }} |"
            echo "| Distro | $DISTRO |"
            echo "| Base image | \`$BASE_DIGEST\` |"
            echo "| Image size (amd64, uncompressed) | $SIZE_AMD64 |"
            echo "| Image size (arm64, uncompressed) | $SIZE_ARM64 |"
          } > IMAGE_INFO.md

      - name: Commit IMAGE_INFO.md
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "dtinth-bot"
          git config user.email "dtinth-bot@users.noreply.github.com"
          git add IMAGE_INFO.md
          git diff --cached --quiet || git commit -m "chore: update image info"
          git push

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
