name: Update version

on:
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * *'

permissions:
  id-token: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Mint write token
        id: write-token
        uses: octo-sts/action@main
        with:
          scope: dtinth/jamulus-docker
          identity: update-version

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.write-token.outputs.token }}

      - name: Load current version
        run: echo "CURRENT_VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Load latest version from GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_VERSION=$(gh release view --repo jamulussoftware/jamulus --json tagName -q '.tagName')
          echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_ENV

      - name: Bump version
        if: env.LATEST_VERSION != env.CURRENT_VERSION
        run: |
          echo "$LATEST_VERSION" > version.txt
          git config user.name "dtinth-bot"
          git config user.email "dtinth-bot@users.noreply.github.com"
          git add version.txt
          git commit -m "Bump jamulus to $LATEST_VERSION"
          git push
